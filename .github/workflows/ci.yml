name: Go CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  go-test:
    name: go-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...
